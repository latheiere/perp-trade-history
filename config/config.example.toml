schema_version = 1

[storage]
# Local folder that will contain collected history and dashboard data.
# PERP_TRADE_HISTORY_DATA_DIR can override it for a managed installation.
data_dir = "data"

[reporting]
# Currency used to compare results in reports and the dashboard.
target_currency = "USDT"
# Daily conversion price. See docs/conversion.md before changing this value.
conversion_method = "previous_day.close"

# Optional fixed conversion for a settlement currency without a public spot pair.
[reporting.fixed_rates]
# INTERNAL_SETTLEMENT_ASSET = "1"

[collection]
# Earliest account history you want to load. Older history may require the manual
# archive workflow described in docs/binance-archive-backfill.md.
initial_start = "2017-01-01T00:00:00Z"
# The remaining defaults balance safe retries with thorough history collection.
overlap_hours = 72
request_timeout_seconds = 30
request_retries = 4
page_limit = 100
max_pages_per_query = 50000

[venues.binance]
# Change to true when this account source should be collected.
enabled = false
account_id = "primary"
base_url = "https://fapi.binance.com"
# Public market-data endpoint used for reporting-currency conversion.
spot_base_url = "https://api.binance.com"
# Leave empty for automatic discovery, or list known historical symbols that may no
# longer appear in current account activity.
symbols = []
discover_active_symbols = true
# Leave this safety limit unchanged unless you intentionally query a larger catalog.
max_public_discovery_symbols = 100

[venues.gate]
# Change to true when this account source should be collected.
enabled = false
account_id = "primary"
base_url = "https://api.gateio.ws"
spot_base_url = "https://api.gateio.ws"
settlements = ["usdt", "btc"]

[venues.mexc]
# Change to true when this account source should be collected.
enabled = false
account_id = "primary"
base_url = "https://contract.mexc.com"
spot_base_url = "https://api.mexc.com"
symbols = []
