[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perp-trade-history"
version = "0.1.0"
description = "Read-only, cross-venue perpetual trading history collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0,<3",
  "statecrate>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
perp-trade-history = "perp_trade_history.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
